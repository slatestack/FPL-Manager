<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPL Manager</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <div>
        <div class="title">FPL Manager</div>
        <div class="subtitle" id="team-line">Loading…</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="deadline" id="deadline" aria-live="polite"></div>
      <button class="btn primary" id="run-btn" type="button">Run dry-run</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main>
    <section class="grid-top">
      <article class="card pitch-card">
        <div class="card-head">
          <h2 id="pitch-title">Lineup</h2>
          <div class="legend">
            <span class="tag in">IN</span> new signing
            <span class="badge c">C</span> captain
            <span class="badge v">V</span> vice
          </div>
        </div>
        <div class="pitch" id="pitch"></div>
        <div class="bench" id="bench"></div>
      </article>

      <div class="side">
        <article class="card">
          <div class="card-head"><h2>Plan</h2><span class="muted" id="plan-meta"></span></div>
          <div class="kpis" id="kpis"></div>
          <ol class="timeline" id="timeline"></ol>
        </article>
        <article class="card">
          <div class="card-head"><h2>Chips</h2><span class="muted" id="chip-meta"></span></div>
          <div id="chips"></div>
          <div id="chip-forecast" hidden></div>
        </article>
        <article class="card">
          <div class="card-head"><h2>Autopilot</h2><span class="muted" id="auto-meta"></span></div>
          <div id="autopilot"></div>
        </article>
      </div>
    </section>

    <article class="card">
      <div class="card-head wrap">
        <h2>Player projections</h2>
        <div class="filters">
          <div class="seg" id="pos-filter" role="group" aria-label="Position">
            <button type="button" data-pos="" class="on">All</button>
            <button type="button" data-pos="GKP">GK</button>
            <button type="button" data-pos="DEF">DEF</button>
            <button type="button" data-pos="MID">MID</button>
            <button type="button" data-pos="FWD">FWD</button>
          </div>
          <input id="search" type="search" placeholder="Search player or team" aria-label="Search">
          <label class="price">Max £<input id="max-price" type="number" step="0.5" min="3.5" max="16" placeholder="any"></label>
          <label class="check"><input id="mine" type="checkbox"> My squad</label>
        </div>
      </div>
      <div class="table-wrap">
        <table id="table">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <button class="btn ghost more" id="more" type="button" hidden>Show more</button>
    </article>

    <article class="card">
      <div class="card-head"><h2>Pipeline</h2><span class="muted" id="model-meta"></span></div>
      <div class="jobs" id="jobs"></div>
    </article>
  </main>

  <footer class="foot">Dry-run only — nothing is submitted to FPL. Expected points are model estimates.</footer>
  <script src="/static/app.js"></script>
</body>
</html>
