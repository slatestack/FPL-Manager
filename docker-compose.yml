services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fpl
      POSTGRES_PASSWORD: fpl
      POSTGRES_DB: fpl
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpl -d fpl"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["python", "-m", "app", "migrate"]
    env_file: [{path: .env, required: false}]
    environment: &db_env
      FPL_DATABASE_URL: postgresql://fpl:fpl@postgres:5432/fpl
      FPL_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}

  ingestion-worker:
    build: .
    command: ["python", "-m", "app", "poll"]
    env_file: [{path: .env, required: false}]
    environment: *db_env
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  api:
    build: .
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [{path: .env, required: false}]
    environment: *db_env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata:
